<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 800" width="100%" height="100%" style="background:#0c1017; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Background grid -->
    <pattern id="wfGrid2" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#161c28" stroke-width="1" />
    </pattern>

    <!-- Globe Glow Filter -->
    <filter id="cyanGlow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Card Shadow -->
    <filter id="softShadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="whiteCardShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- Globe Radial Gradient -->
    <radialGradient id="globeGrad2" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1320" height="800" fill="#0c1017" />
  <rect width="1320" height="800" fill="url(#wfGrid2)" opacity="0.6" />

  <!-- Flow lines in background -->
  <path d="M 470 180 Q 520 260 550 380 T 630 400" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6" opacity="0.4" />
  <path d="M 880 395 C 930 395, 960 375, 1000 375" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.8" />
  
  <path d="M 680 580 Q 640 480 680 430" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 5" opacity="0.35" />
  <path d="M 880 435 C 920 450, 930 520, 960 550" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="5 5" opacity="0.8" />

  <!-- Header Banner -->
  <g transform="translate(40, 24)">
    <text x="0" y="0" fill="#f59e0b" font-size="11" font-weight="700" letter-spacing="1.5" font-family="monospace">SDTRACKER // OPERATIONAL APP WORKFLOW &amp; SECURITY ARCHITECTURE</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 1. TOP-LEFT CONTAINER: OPERATIONS & FRONTLINE KEYWORKERS                  -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 44)">
    <rect width="470" height="236" rx="20" fill="#181d27" stroke="#2b3345" stroke-width="1.5" filter="url(#softShadow2)" />

    <!-- 1A: Operations Managers (Left half) -->
    <g transform="translate(30, 22)">
      <!-- Verified Badge -->
      <path d="M 80 45 C 75 25, 95 10, 105 18" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" />
      <circle cx="112" cy="22" r="14" fill="#242b3b" stroke="#10b981" stroke-width="1.5" />
      <circle cx="112" cy="18" r="4.5" fill="#10b981" />
      <path d="M 104 29 C 104 25, 108 23, 112 23 C 116 23, 120 25, 120 29 Z" fill="#10b981" />

      <!-- Person at Workstation Illustration -->
      <circle cx="70" cy="52" r="14" fill="none" stroke="#f8fafc" stroke-width="2" />
      <path d="M 72 48 Q 78 52 74 60" fill="none" stroke="#f8fafc" stroke-width="1.5" />
      <path d="M 48 105 C 48 78, 62 70, 72 70 C 82 70, 96 78, 96 105 Z" fill="none" stroke="#f8fafc" stroke-width="2" />
      <path d="M 60 88 L 44 102 L 32 102" fill="none" stroke="#f8fafc" stroke-width="2" />
      <line x1="16" y1="104" x2="68" y2="104" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 22 104 L 30 76 L 58 76 L 50 104" fill="#0f172a" stroke="#f8fafc" stroke-width="2" />
      <circle cx="44" cy="90" r="3" fill="#38bdf8" />
      <line x1="8" y1="108" x2="140" y2="108" stroke="#475569" stroke-width="2" stroke-linecap="round" />

      <!-- Label -->
      <text x="74" y="142" fill="#f8fafc" font-size="16" font-weight="700" text-anchor="middle">Operations Managers</text>
      <text x="74" y="160" fill="#94a3b8" font-size="11" text-anchor="middle">Central Site &amp; Shift Oversight</text>
    </g>

    <!-- 1B: Mobile Engineers & Keyworkers (Right half) -->
    <g transform="translate(250, 22)">
      <!-- Mobile / Tablet Device Mockup -->
      <g transform="translate(45, 15)">
        <rect x="0" y="0" width="55" height="92" rx="8" fill="#111622" stroke="#f8fafc" stroke-width="2" />
        <line x1="20" y1="8" x2="35" y2="8" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" />
        <circle cx="27" cy="82" r="3.5" fill="none" stroke="#f8fafc" stroke-width="1.5" />
        <rect x="8" y="16" width="39" height="12" rx="2" fill="#38bdf8" />
        <line x1="8" y1="36" x2="47" y2="36" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" />
        <line x1="8" y1="46" x2="35" y2="46" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
        <line x1="8" y1="56" x2="40" y2="56" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
      </g>

      <!-- Label -->
      <text x="72" y="142" fill="#f8fafc" font-size="16" font-weight="700" text-anchor="middle">Mobile Keyworkers</text>
      <text x="72" y="160" fill="#94a3b8" font-size="11" text-anchor="middle">Defect Triage &amp; Inspections</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 2. BOTTOM-LEFT CONTAINER: REGULATORY, PARTNERS & THREAT ISOLATION         -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 480)">
    <rect width="700" height="250" rx="20" fill="#181d27" stroke="#2b3345" stroke-width="1.5" filter="url(#softShadow2)" />

    <!-- 2A: Local Authority & VCS Partners (Left) -->
    <g transform="translate(40, 25)">
      <!-- Government / Council Building Icon -->
      <g transform="translate(45, 10)">
        <path d="M 30 10 L 0 28 L 60 28 Z" fill="#242b3b" stroke="#f8fafc" stroke-width="2" />
        <line x1="8" y1="30" x2="8" y2="72" stroke="#f8fafc" stroke-width="2" />
        <line x1="22" y1="30" x2="22" y2="72" stroke="#f8fafc" stroke-width="2" />
        <line x1="38" y1="30" x2="38" y2="72" stroke="#f8fafc" stroke-width="2" />
        <line x1="52" y1="30" x2="52" y2="72" stroke="#f8fafc" stroke-width="2" />
        <rect x="0" y="72" width="60" height="12" rx="2" fill="#1e2536" stroke="#f8fafc" stroke-width="1.8" />
      </g>
      <line x1="10" y1="110" x2="140" y2="110" stroke="#475569" stroke-width="2" stroke-linecap="round" />

      <!-- Label -->
      <text x="75" y="145" fill="#f8fafc" font-size="16" font-weight="700" text-anchor="middle">Local Authority VCS</text>
      <text x="75" y="165" fill="#94a3b8" font-size="11" text-anchor="middle">Safeguarding &amp; Referrals</text>
    </g>

    <!-- 2B: External Contractors (Center) -->
    <g transform="translate(265, 25)">
      <!-- Wrench & Invoice Clipboard -->
      <g transform="translate(45, 12)">
        <rect x="0" y="0" width="55" height="78" rx="6" fill="#111622" stroke="#f8fafc" stroke-width="2" />
        <rect x="18" y="-6" width="18" height="10" rx="3" fill="#334155" stroke="#f8fafc" stroke-width="1.5" />
        <line x1="12" y1="20" x2="43" y2="20" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" />
        <line x1="12" y1="32" x2="35" y2="32" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
        <line x1="12" y1="44" x2="40" y2="44" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
        <!-- Tool overlay -->
        <circle cx="48" cy="62" r="14" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
        <path d="M 44 58 L 52 66 M 46 68 L 50 64" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
      </g>
      <line x1="10" y1="110" x2="155" y2="110" stroke="#475569" stroke-width="2" stroke-linecap="round" />

      <!-- Label -->
      <text x="82" y="145" fill="#f8fafc" font-size="16" font-weight="700" text-anchor="middle">Trade Contractors</text>
      <text x="82" y="165" fill="#94a3b8" font-size="11" text-anchor="middle">Photo Signs &amp; Invoices</text>
    </g>

    <!-- 2C: Cross-Site Tenant Tampering / Threats (Right) -->
    <g transform="translate(485, 25)">
      <!-- Security Shield with Exploit Radar -->
      <g transform="translate(50, 15)">
        <circle cx="30" cy="35" r="32" fill="#0b0f17" stroke="#f43f5e" stroke-width="2.5" />
        <circle cx="30" cy="35" r="20" fill="none" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="4 2" />
        <circle cx="30" cy="35" r="8" fill="none" stroke="#f43f5e" stroke-width="1.2" />
        <line x1="0" y1="35" x2="60" y2="35" stroke="#f43f5e" stroke-width="1.2" />
        <line x1="30" y1="5" x2="30" y2="65" stroke="#f43f5e" stroke-width="1.2" />
        <circle cx="44" cy="24" r="3.5" fill="#f43f5e" />
      </g>
      <line x1="10" y1="110" x2="160" y2="110" stroke="#475569" stroke-width="2" stroke-linecap="round" />

      <!-- Label -->
      <text x="85" y="145" fill="#f8fafc" font-size="16" font-weight="700" text-anchor="middle">Tenant Isolation Breaches</text>
      <text x="85" y="165" fill="#f43f5e" font-size="11" font-weight="600" text-anchor="middle">Blocked by PostgreSQL RLS</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 3. CENTER: SECURE CLOUD INGRESS & GLOWING GLOBE                           -->
  <!-- ========================================================================= -->
  <g transform="translate(420, 370)">
    <!-- Cyan glow halo -->
    <circle cx="0" cy="0" r="54" fill="#00e5ff" opacity="0.25" filter="url(#cyanGlow2)" />
    <!-- Globe sphere -->
    <circle cx="0" cy="0" r="44" fill="url(#globeGrad2)" />
    
    <!-- Longitude & Latitude Lines -->
    <ellipse cx="0" cy="0" rx="34" ry="44" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.8" />
    <ellipse cx="0" cy="0" rx="18" ry="44" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.8" />
    <line x1="0" y1="-44" x2="0" y2="44" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />
    <line x1="-44" y1="0" x2="44" y2="0" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />
    <ellipse cx="0" cy="-18" rx="40" ry="12" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.7" />
    <ellipse cx="0" cy="18" rx="40" ry="12" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.7" />
    
    <!-- Pulse nodes -->
    <circle cx="-38" cy="14" r="2.5" fill="#ffffff" />
    <circle cx="28" cy="-22" r="2.5" fill="#ffffff" />
    <circle cx="14" cy="30" r="2.5" fill="#ffffff" />
  </g>

  <!-- Telemetry dots -->
  <g transform="translate(625, 275)">
    <circle cx="0" cy="0" r="5" fill="#ef4444" />
    <circle cx="15" cy="0" r="5" fill="#f59e0b" />
    <circle cx="30" cy="0" r="5" fill="#22c55e" />
  </g>

  <!-- ========================================================================= -->
  <!-- 4. CENTER: SDTRACKER RBAC & ROW-LEVEL SECURITY GATEWAY                    -->
  <!-- ========================================================================= -->
  <g transform="translate(560, 305)">
    <rect width="270" height="195" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#whiteCardShadow2)" />
    <rect x="12" y="12" width="246" height="171" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />

    <!-- Security Gateway Shield Motif -->
    <g transform="translate(135, 60)">
      <path d="M 0 -22 L 20 -14 C 20 6, 12 18, 0 24 C -12 18, -20 6, -20 -14 Z" fill="#0f172a" />
      <path d="M 0 -17 L 15 -10 C 15 5, 9 14, 0 19 C -9 14, -15 5, -15 -10 Z" fill="#ffffff" />
      <path d="M 0 -8 C 5 -4, 8 2, 5 9 C 2 12, -2 12, -5 9 C -8 4, -4 -2, 0 -8 Z" fill="#f97316" />
    </g>

    <!-- Title -->
    <text x="135" y="120" fill="#0f172a" font-size="19" font-weight="900" text-anchor="middle" letter-spacing="-0.5">SDTracker Core</text>
    <text x="135" y="144" fill="#0f172a" font-size="19" font-weight="900" text-anchor="middle" letter-spacing="-0.5">Security Gateway</text>
    <text x="135" y="166" fill="#64748b" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">RBAC &amp; ROW-LEVEL SECURITY</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 5. DECISION BADGES: VERIFIED OPERATIONS (✓) & BLOCKED TAMPERING (✖)      -->
  <!-- ========================================================================= -->
  <!-- ALLOWED (✓) Checkmark Badge -->
  <g transform="translate(930, 375)">
    <circle cx="0" cy="0" r="22" fill="#181d27" stroke="#334155" stroke-width="2" filter="url(#softShadow2)" />
    <path d="M -8 0 L -2 6 L 8 -6" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- BLOCKED (✖) Crossmark Badge -->
  <g transform="translate(880, 555)">
    <circle cx="0" cy="0" r="22" fill="#181d27" stroke="#334155" stroke-width="2" filter="url(#softShadow2)" />
    <path d="M -6 -6 L 6 6 M 6 -6 L -6 6" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <g transform="translate(880, 595)">
    <text x="0" y="0" fill="#ef4444" font-size="11" font-weight="700" text-anchor="middle" font-family="monospace">TAMPERING BLOCKED</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 6. RIGHT CONTAINER: CORE SDTRACKER APPLICATION WIREFRAME FUNCTIONS        -->
  <!-- ========================================================================= -->
  <g transform="translate(980, 140)">
    <rect width="300" height="600" rx="22" fill="#181d27" stroke="#2b3345" stroke-width="1.5" filter="url(#softShadow2)" />

    <!-- 6A: Property & Site Operations (Top) -->
    <g transform="translate(150, 75)">
      <!-- Property & Room Asset Icon -->
      <g transform="translate(-25, -28)">
        <rect x="0" y="8" width="50" height="38" rx="4" fill="#111622" stroke="#f8fafc" stroke-width="2" />
        <path d="M -6 10 L 25 -10 L 56 10" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <rect x="18" y="24" width="14" height="22" rx="2" fill="#38bdf8" />
        <rect x="8" y="16" width="8" height="8" rx="1" fill="#94a3b8" />
        <rect x="34" y="16" width="8" height="8" rx="1" fill="#94a3b8" />
      </g>
      <text x="0" y="44" fill="#f8fafc" font-size="17" font-weight="700" text-anchor="middle">Property &amp; Rooms</text>
      <text x="0" y="62" fill="#94a3b8" font-size="11" text-anchor="middle">Multi-Site Asset &amp; Bed Ledger</text>
    </g>

    <line x1="25" y1="180" x2="275" y2="180" stroke="#2a3346" stroke-width="1" />

    <!-- 6B: Safeguarding & Resident Directory (Middle) -->
    <g transform="translate(150, 260)">
      <!-- Resident Profile & Household Group Icon -->
      <g transform="translate(-25, -26)">
        <circle cx="15" cy="0" r="12" fill="#111622" stroke="#f8fafc" stroke-width="2" />
        <path d="M 0 32 C 0 20, 8 18, 15 18 C 22 18, 30 20, 30 32 Z" fill="#111622" stroke="#f8fafc" stroke-width="2" />
        <!-- Child / Linked dependent -->
        <circle cx="38" cy="8" r="8" fill="#111622" stroke="#38bdf8" stroke-width="1.8" />
        <path d="M 28 32 C 28 24, 33 22, 38 22 C 43 22, 48 24, 48 32 Z" fill="#111622" stroke="#38bdf8" stroke-width="1.8" />
      </g>
      <text x="0" y="44" fill="#f8fafc" font-size="17" font-weight="700" text-anchor="middle">Safeguarding &amp; Care</text>
      <text x="0" y="62" fill="#94a3b8" font-size="11" text-anchor="middle">Service Users &amp; Kinship Graphs</text>
    </g>

    <line x1="25" y1="365" x2="275" y2="365" stroke="#2a3346" stroke-width="1" />

    <!-- 6C: Maintenance SLAs & Defect Triage (Lower Middle) -->
    <g transform="translate(150, 445)">
      <!-- SLA Timer & Defect Order Mockup -->
      <g transform="translate(-25, -26)">
        <rect x="0" y="0" width="50" height="38" rx="4" fill="#111622" stroke="#f8fafc" stroke-width="2" />
        <circle cx="25" cy="19" r="10" fill="none" stroke="#f59e0b" stroke-width="1.8" />
        <line x1="25" y1="19" x2="25" y2="13" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" />
        <line x1="25" y1="19" x2="30" y2="19" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" />
        <circle cx="40" cy="5" r="4.5" fill="#f43f5e" />
      </g>
      <text x="0" y="44" fill="#f8fafc" font-size="17" font-weight="700" text-anchor="middle">Maintenance &amp; SLAs</text>
      <text x="0" y="62" fill="#94a3b8" font-size="11" text-anchor="middle">CAT 1-3 Dispatch &amp; Sign-Off</text>
    </g>

    <line x1="25" y1="540" x2="275" y2="540" stroke="#2a3346" stroke-width="1" />

    <!-- 6D: Finance & Compliance Reports (Bottom) -->
    <g transform="translate(150, 565)">
      <text x="0" y="10" fill="#f8fafc" font-size="14" font-weight="700" text-anchor="middle">Finance &amp; Audit Engine</text>
      <text x="0" y="26" fill="#94a3b8" font-size="10" text-anchor="middle">Invoices • Home Office FRA Reports</text>
    </g>
  </g>

</svg>
